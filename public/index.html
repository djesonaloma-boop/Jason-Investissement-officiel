<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASON INVEST — Connexion</title>
<style>
:root{--bg:#030711;--bg2:#07111f;--card:rgba(10,20,36,.88);--gold:#d8b45a;--gold-light:#f1d98b;--text:#ffffff;--muted:#8997aa;--border:rgba(216,180,90,.18);--green:#5ee49a;--red:#ff7c8d;}
*{box-sizing:border-box;}html{scroll-behavior:smooth;}
body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 20%,rgba(216,180,90,.09),transparent 25%),radial-gradient(circle at 85% 75%,rgba(69,130,255,.08),transparent 28%),linear-gradient(135deg,#030711,#07111f 50%,#040914);}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.glow{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(70px);opacity:.18;animation:glowMove 10s ease-in-out infinite alternate;}
.glow.one{top:-120px;left:-100px;background:#d8b45a;}
.glow.two{right:-120px;bottom:-120px;background:#386cff;animation-delay:2s;}
.glow.three{top:45%;left:50%;width:180px;height:180px;background:#9c6cff;animation-delay:4s;}
@keyframes glowMove{from{transform:translate(0,0) scale(1);}to{transform:translate(80px,40px) scale(1.25);}}
.particles{position:absolute;inset:0;}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-light);opacity:0;animation:particleFloat linear infinite;}
@keyframes particleFloat{0%{transform:translateY(110vh) scale(.4);opacity:0;}10%{opacity:.7;}90%{opacity:.4;}100%{transform:translateY(-10vh) scale(1);opacity:0;}}
.auth-page{position:relative;z-index:2;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px 15px;}
.auth-wrapper{width:100%;max-width:440px;animation:pageAppear .8s ease;}
@keyframes pageAppear{from{opacity:0;transform:translateY(30px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.auth-card{position:relative;width:100%;padding:30px 24px;border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015)),var(--card);border:1px solid var(--border);box-shadow:0 30px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(18px);overflow:hidden;}
.auth-card::before{content:"";position:absolute;width:180px;height:180px;right:-100px;top:-100px;border-radius:50%;border:1px solid rgba(216,180,90,.15);animation:rotateRing 12s linear infinite;}
.auth-card::after{content:"";position:absolute;width:120px;height:120px;left:-70px;bottom:-70px;border-radius:50%;border:1px solid rgba(216,180,90,.10);animation:rotateRing 9s linear infinite reverse;}
@keyframes rotateRing{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.logo-area{position:relative;text-align:center;margin-bottom:18px;}
.logo{position:relative;width:76px;height:76px;margin:auto;display:flex;justify-content:center;align-items:center;border-radius:24px;background:linear-gradient(145deg,var(--gold-light),var(--gold));color:#07101d;font-size:24px;font-weight:900;box-shadow:0 12px 35px rgba(216,180,90,.20);animation:logoFloat 3s ease-in-out infinite,logoGlow 2.5s ease-in-out infinite alternate;}
.logo::before{content:"";position:absolute;inset:-7px;border:1px solid rgba(216,180,90,.30);border-radius:29px;animation:ringPulse 2.5s ease-in-out infinite;}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-6px) rotate(2deg);}}
@keyframes logoGlow{from{box-shadow:0 10px 30px rgba(216,180,90,.12);}to{box-shadow:0 15px 45px rgba(216,180,90,.30);}}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.35;}50%{transform:scale(1.08);opacity:.8;}}
.title{text-align:center;margin:0;font-size:29px;letter-spacing:1.5px;}
.title span{color:var(--gold-light);}
.subtitle{text-align:center;color:var(--muted);margin:8px 0 24px;font-size:14px;}
.gold-line{width:65px;height:3px;margin:0 auto 25px;border-radius:20px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.switch-area{text-align:center;margin-top:22px;}
.switch-text{color:var(--muted);font-size:13px;}
.switch-button{margin-top:5px;border:0;background:transparent;color:var(--gold-light);font-size:14px;cursor:pointer;text-decoration:underline;}
.form-section{display:none;animation:formAppear .4s ease;}
.form-section.active{display:block;}
@keyframes formAppear{from{opacity:0;transform:translateX(15px);}to{opacity:1;transform:translateX(0);}}
.form-title{text-align:center;font-size:20px;margin:0 0 20px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;margin-bottom:7px;color:#c9d2df;font-size:13px;}
.form-group input{display:block;width:100%;height:49px;padding:0 14px;border-radius:12px;border:1px solid #26384f;outline:none;background:#06101d;color:#fff;font-size:14px;}
.form-group input:focus{border-color:var(--gold);}
.terms{display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:12px;line-height:1.5;}
.terms input{margin-top:3px;accent-color:var(--gold);}
.main-button{position:relative;width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#07101d;font-weight:900;font-size:15px;cursor:pointer;overflow:hidden;}
.main-button:disabled{opacity:.55;cursor:not-allowed;}
.forgot{display:block;text-align:right;margin-top:9px;margin-bottom:4px;color:var(--gold-light);font-size:12px;text-decoration:none;}
.message{display:none;padding:12px;margin-bottom:17px;border-radius:11px;text-align:center;font-size:13px;}
.message.show{display:block;}
.message.success{background:rgba(40,167,69,.12);color:var(--green);border:1px solid rgba(40,167,69,.25);}
.message.error{background:rgba(220,53,69,.12);color:var(--red);border:1px solid rgba(220,53,69,.25);}
.message.info{background:rgba(23,162,184,.12);color:#71d9e8;border:1px solid rgba(23,162,184,.25);}
.features{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:20px;}
.feature{padding:6px 9px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);color:#8e9bad;font-size:10px;}
.footer{text-align:center;margin-top:17px;color:#526176;font-size:11px;}
</style>
</head>
<body>
<div class="background"><div class="glow one"></div><div class="glow two"></div><div class="glow three"></div><div class="particles" id="particles"></div></div>
<main class="auth-page">
<div class="auth-wrapper">
<div class="auth-card">
<div class="logo-area"><div class="logo">JI</div></div>
<h1 class="title">JASON <span>INVEST</span></h1>
<p class="subtitle">Votre espace personnel</p>
<div class="gold-line"></div>
<div id="message" class="message"></div>

<section id="connexionSection" class="form-section active">
<h2 class="form-title">Connexion</h2>
<form id="connexionForm">
<div class="form-group"><label>Adresse Gmail / E-mail</label><input type="email" id="connexionEmail" placeholder="exemple@gmail.com" required></div>
<div class="form-group"><label>Mot de passe</label><input type="password" id="connexionPassword" placeholder="Votre mot de passe" required></div>
<a href="#" id="forgotPassword" class="forgot">Mot de passe oublié ?</a>
<button type="submit" id="connexionButton" class="main-button">Se connecter</button>
</form>
<div class="switch-area"><div class="switch-text">Vous n'avez pas encore de compte ?</div><button id="showInscription" class="switch-button">Créer un compte</button></div>
</section>

<section id="inscriptionSection" class="form-section">
<h2 class="form-title">Créer un compte</h2>
<form id="inscriptionForm">
<div class="form-group"><label>Nom complet</label><input type="text" id="name" placeholder="Votre nom complet" required></div>
<div class="form-group"><label>Numéro de téléphone</label><input type="tel" id="phone" placeholder="+243..." required></div>
<div class="form-group"><label>Adresse Gmail / E-mail</label><input type="email" id="email" placeholder="exemple@gmail.com" required></div>
<div class="form-group"><label>Mot de passe</label><input type="password" id="password" placeholder="Créer un mot de passe" minlength="6" required></div>
<div class="form-group"><label>Confirmer le mot de passe</label><input type="password" id="passwordConfirm" placeholder="Répéter le mot de passe" required></div>
<div class="form-group"><label>Code de parrainage <span style="color:#637188;">(facultatif)</span></label><input type="text" id="referral" placeholder="Ex. JAS-XXXXXX"></div>
<div class="form-group"><label class="terms"><input type="checkbox" id="terms" required><span>J'accepte les conditions d'utilisation de JASON INVEST.</span></label></div>
<button type="submit" id="inscriptionButton" class="main-button">Créer mon compte</button>
</form>
<div class="switch-area"><div class="switch-text">Vous avez déjà un compte ?</div><button id="showConnexion" class="switch-button">Se connecter</button></div>
</section>

<div class="features"><span class="feature">🔐 Sécurisé</span><span class="feature">📱 Mobile</span><span class="feature">⚡ Rapide</span><span class="feature">🔔 Notifications</span></div>
</div>
<div class="footer">© <span id="year"></span> JASON INVEST</div>
</div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
$("year").textContent = new Date().getFullYear();

const particles = $("particles");
for(let i=0;i<32;i++){const p=document.createElement("span");p.className="particle";p.style.left=Math.random()*100+"%";p.style.animationDuration=(7+Math.random()*9)+"s";p.style.animationDelay=(-Math.random()*12)+"s";particles.appendChild(p);}

function showMessage(text,type){const box=$("message");box.textContent=text;box.className="message show "+type;box.scrollIntoView({behavior:"smooth",block:"center"});}
function hideMessage(){$("message").className="message";}

$("showInscription").addEventListener("click",()=>{$("connexionSection").classList.remove("active");$("inscriptionSection").classList.add("active");hideMessage();});
$("showConnexion").addEventListener("click",()=>{$("inscriptionSection").classList.remove("active");$("connexionSection").classList.add("active");hideMessage();});

function getUsers(){return JSON.parse(localStorage.getItem('jason_users')||'[]');}
function saveUsers(u){localStorage.setItem('jason_users',JSON.stringify(u));}

$("connexionForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  const email=$("connexionEmail").value.trim().toLowerCase();
  const password=$("connexionPassword").value;
  const users=getUsers();
  const user=users.find(u=>u.email===email && u.password===password);
  if(!user){showMessage("Email ou mot de passe incorrect","error");return;}
  localStorage.setItem('jason_current',JSON.stringify(user));
  showMessage("Connexion réussie - Redirection...","success");
  setTimeout(()=>{location.href="dashboard.html";},800);
});

$("inscriptionForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  const name=$("name").value.trim();
  const phone=$("phone").value.trim();
  const email=$("email").value.trim().toLowerCase();
  const password=$("password").value;
  const passwordConfirm=$("passwordConfirm").value;
  const referral=$("referral").value.trim().toUpperCase();
  const terms=$("terms").checked;

  if(!name||!phone||!email){showMessage("Remplis tous les champs","error");return;}
  if(password.length<6){showMessage("Mot de passe 6 caractères minimum","error");return;}
  if(password!==passwordConfirm){showMessage("Les mots de passe ne correspondent pas","error");return;}
  if(!terms){showMessage("Accepte les conditions","error");return;}

  const users=getUsers();
  if(users.find(u=>u.email===email)){showMessage("Cet email existe déjà","error");return;}

  const newUser={id:Date.now(),name,phone,email,password,referral_code:referral,solde:0,date: new Date().toISOString()};
  users.push(newUser);
  saveUsers(users);
  localStorage.setItem('jason_current',JSON.stringify(newUser));
  showMessage("Compte créé avec succès !","success");
  setTimeout(()=>{location.href="dashboard.html";},900);
});

$("forgotPassword").addEventListener("click",(e)=>{e.preventDefault();showMessage("Contacte le support sur WhatsApp pour réinitialiser","info");});
</script>
</body>
</html>
